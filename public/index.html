<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="Assets/dot.svg">
  <title>EyeTrainer</title>
</head>
<body>
  <div class="game"><div class="dot" id="dot"></div></div>

  <div class="ui">
    <div class="controls-panel">
      <div class="control-row">
        <div id="velocitytext">Speed: <span id="velocityvalue">3</span></div>
        <button type="button" class="slider-step-button" id="velocityminus" aria-label="Decrease speed">−</button>
        <input id="velocityslider" type="range" min="0.25" max="25" value="3" step="0.001">
        <button type="button" class="slider-step-button" id="velocityplus" aria-label="Increase speed">+</button>
      </div>

      <div class="control-row">
        <div id="sizetext">Size: <span id="sizevalue">2</span></div>
        <button type="button" class="slider-step-button" id="sizeminus" aria-label="Decrease target size">−</button>
        <input id="sizeslider" type="range" min="0.01" max="10" value="2" step="0.001">
        <button type="button" class="slider-step-button" id="sizeplus" aria-label="Increase target size">+</button>
      </div>

      <div class="control-row">
        <div id="rangetext">Range: <span id="rangevalue">25</span></div>
        <button type="button" class="slider-step-button" id="rangeminus" aria-label="Decrease range">−</button>
        <input id="rangeslider" type="range" min="1" max="49" value="25" step="1">
        <button type="button" class="slider-step-button" id="rangeplus" aria-label="Increase range">+</button>
      </div>

      <div class="color-control-row">
        <label for="targetcolor">Target Color</label>
        <input id="targetcolor" type="color" value="#e2b714" aria-label="Target color">
      </div>

      <div class="color-control-row">
        <label for="backgroundcolor">Background Color</label>
        <input id="backgroundcolor" type="color" value="#1e1e1e" aria-label="Background color">
      </div>

      <div class="routine-controls">
        <div class="routine-change-row">
          <div class="changeroutine">Change Routine</div>
          <div class="arrow left"></div>
          <div class="arrow right"></div>
        </div>
        <div class="routinename">Routine Name</div>
      </div>
    </div>
  </div>

  <script src="./Engine/GameLoop.js" type="module"></script>
  <script src="./Game.js" type="module"></script>
</body>
</html>
